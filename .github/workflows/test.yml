name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: fe
        run: npm install

      - name: Run unit tests
        working-directory: fe
        run: npm run test:run

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: fe
        run: npm install

      - name: Install Playwright browsers
        working-directory: fe
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env << ENVEOF
          MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_PASSWORD }}
          APP_MONGO_DATABASE=${{ secrets.MONGO_DATABASE_TEST }}
          APP_SALT_ROUND=10
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          NUXT_BASE_URL_API_INTERNAL=http://backend:3000
          NUXT_PUBLIC_BASE_URL_API=http://localhost:3000
          NUXT_PUBLIC_BASE_URL_WS=ws://localhost:3000/entrypoint
          APP_CORS_ORIGIN=http://localhost:3001
          THROTTLE_TTL=60000
          THROTTLE_LIMIT=1000
          ENVEOF

      - name: Start services with Docker Compose
        run: docker compose up -d --wait --wait-timeout 120

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3001 > /dev/null; then
              echo "Frontend is ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Run E2E tests
        working-directory: fe
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: fe/playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
